<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>T900 Overlay</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
body{font-family:'Inter Display','Inter',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
#top{left:0;width:1080px;top:215px;text-align:center}
#brand{font-size:26px;font-weight:800;letter-spacing:.16em;color:#ff6a1a;text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#labelBox{height:96px;overflow:hidden;margin-top:6px;position:relative}
.lab{position:absolute;left:0;width:1080px;font-size:74px;font-weight:800;letter-spacing:-.035em;line-height:96px;text-shadow:0 4px 24px rgba(0,0,0,.6)}
#cap{left:90px;width:820px;top:1210px;text-align:center;font-size:66px;font-weight:800;line-height:1.08;letter-spacing:-.02em}
#cap .w{display:inline-block;margin:0 .02em;paint-order:stroke fill;-webkit-text-stroke:10px rgba(0,0,0,.85);text-shadow:0 6px 18px rgba(0,0,0,.55)}
#cap .w.hi{color:#ff7a2a}
#card{left:90px;width:900px;top:1150px;border-radius:44px;padding:26px 36px 30px;background:rgba(14,14,16,.82);border:2px solid rgba(255,255,255,.12);
  box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center;backdrop-filter:blur(8px)}
#card .row1{display:flex;justify-content:center;align-items:center;gap:20px}
.disc{background:#ff2d55;font-weight:900;font-size:50px;padding:4px 20px;border-radius:14px;letter-spacing:-.02em}
.old{font-size:42px;color:#9a9ca6;text-decoration:line-through;font-weight:600}
.price{font-size:170px;font-weight:900;letter-spacing:-.06em;line-height:.95;margin-top:6px}
.price sup{font-size:58px;vertical-align:top;position:relative;top:22px;margin-right:10px;letter-spacing:-.02em}
.price em{font-style:normal;font-size:76px}
.info{font-size:32px;color:#d4d5dc;font-weight:600;margin-top:10px}
.info b{color:#25d5a8}
#cta{left:0;width:1080px;top:1478px;text-align:center}
#cta span{display:inline-block;background:#ff2d55;font-size:44px;font-weight:800;padding:24px 56px;border-radius:99px;box-shadow:0 0 60px rgba(255,45,85,.55)}
</style></head><body>
<div id="top" class="abs"><div id="brand">T900 · Oferta relâmpago</div><div id="labelBox"></div></div>
<div id="cap" class="abs"></div>
<div id="card" class="abs">
  <div class="row1"><span class="disc" id="disc">-80%</span><span class="old">R$ 259,90</span></div>
  <div class="price"><sup>R$</sup><span id="price">53</span><em>,00</em></div>
  <div class="info" id="inf"><b>Frete grátis</b> · 3x R$ 17,66 sem juros</div>
</div>
<div id="cta" class="abs"><span>🛒 Toca no carrinho</span></div>
<script>
const TL=/*TL*/;
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), lerp=(a,b,p)=>a+(b-a)*p, prog=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=p=>1-Math.pow(1-p,4), eBack=p=>{const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)}, eExpo=p=>p>=1?1:1-Math.pow(2,-10*p);
const C=TL.C, NS=TL.NS, END=TL.END;
const LABELS=['Smartwatch T900','Tela 2,02" HD','Saúde 24 horas','Carregamento sem fio','Ligações · NFC · GPS','Vários mostradores','+2 pulseiras e capinha','Black Friday · -80%'];
// caption groups: [[chunkIndex,[words]],...]  *word* = highlight
const G=[
 [[0,['Conheça','o']],[1,['*T900.*']]],
 [[2,['Feito','pra','quem','*não*','*para.*']]],
 [[3,['Tela']],[4,['*gigante,*']],[5,['nítida','em','qualquer','luz.']]],
 [[6,['*Batimento,*']],[7,['*oxigênio*']],[8,['e','*pressão…*']]],
 [[9,['*24*','*horas*','no','seu','pulso.']]],
 [[10,['Carrega','*sem*','*fio.*']],[11,['É','só','encostar.']]],
 [[12,['Atende','ligação','*direto*','*do*','*pulso.*']]],
 [[13,['Com','*NFC*']],[14,['e','*GPS.*']]],
 [[15,['E','olha','ele','*de*','*verdade:*']]],
 [[16,['um','visual']],[17,['*pra*','*cada*','*dia.*']]],
 [[18,['Ainda','vem','com','*duas*','*pulseiras*','*extras*','e','capinha!']]],
 [[19,['Tudo','isso','por','só','*53*','*reais,*','com','*frete*','*grátis!*']]],
 [[20,['*Toca*','*no*','*carrinho*','e','garante','o','seu!']]],
];
// word timing: spread over the chunk by character length
const groups=G.map(g=>{const words=[];for(const [ci,ws] of g){const c=C[ci];const lens=ws.map(w=>w.replace(/\*/g,'').length+1);const tot=lens.reduce((a,b)=>a+b,0);let acc=0;
  ws.forEach((w,k)=>{words.push({txt:w.replace(/\*/g,''),hi:w.startsWith('*'),t:c.s+(c.e-c.s)*acc/tot});acc+=lens[k];});}
  return {words,s:words[0].t-.06,last:C[g[g.length-1][0]].e};});
groups.forEach((g,i)=>{g.e=i<groups.length-1?Math.min(groups[i+1].s,g.last+.6):END+1;});
// build DOM
const capEl=$('cap'); groups.forEach((g,i)=>{const d=document.createElement('div');d.id='g'+i;d.style.position='absolute';d.style.left='0';d.style.width='820px';
  d.innerHTML=g.words.map((w,k)=>`<span class="w${w.hi?' hi':''}" id="g${i}w${k}">${w.txt}</span>`).join(' ');capEl.appendChild(d);});
const lb=$('labelBox'); LABELS.forEach((l,i)=>{const d=document.createElement('div');d.className='lab';d.id='l'+i;d.textContent=l;lb.appendChild(d);});

function render(T){
  // scene labels
  for(let i=0;i<8;i++){const a=NS[i]+(i?0:.2),b=NS[i+1];const pin=eExpo(prog(T,a,a+.5)),pout=eOut(prog(T,b-.25,b));const el=$('l'+i);
    el.style.transform=`translateY(${(1-pin)*100-pout*100}%)`;el.style.opacity=(T<a||T>b)?0:1;}
  $('brand').style.opacity=eOut(prog(T,.2,.7));
  // captions
  const capTop = T>=C[19].s-.1 ? 995 : 1210;  // move above the price card at the end
  capEl.style.top=capTop+'px';
  groups.forEach((g,i)=>{const el=$('g'+i);const vis=T>=g.s&&T<g.e;el.style.visibility=vis?'visible':'hidden';
    if(!vis)return; const out=eOut(prog(T,g.e-.12,g.e)); el.style.opacity=1-out;
    g.words.forEach((w,k)=>{const p=prog(T,w.t-.04,w.t+.16);const s=$('g'+i+'w'+k);s.style.opacity=p>0?1:0;s.style.transform=`scale(${p>0?lerp(.6,1,eBack(p)):.6})`;});});
  // price card
  const cs=C[19].s-.15; const cp=eBack(prog(T,cs,cs+.45));
  $('card').style.opacity=prog(T,cs,cs+.2); $('card').style.transform=`translateY(${(1-cp)*120}px) scale(${lerp(.9,1,cp)})`;
  const pa=C[19].s+.25, pb=C[19].s+.5*(C[19].e-C[19].s);
  $('disc').textContent='-'+Math.round(80*eExpo(prog(T,pa,pb)))+'%';
  $('price').textContent=Math.round(lerp(259,53,eExpo(prog(T,pa,pb))));
  const ia=C[19].s+.68*(C[19].e-C[19].s); $('inf').style.opacity=eOut(prog(T,ia,ia+.3));
  const ca=C[20].s-.1, cq=eBack(prog(T,ca,ca+.4));
  $('cta').style.opacity=prog(T,ca,ca+.15); $('cta').style.transform=`scale(${lerp(.7,1,cq)*(1+.045*Math.max(0,Math.sin((T-ca)*6.5)))})`;
}
window.render=render; window.DUR=END; render(0);
</script></body></html>
